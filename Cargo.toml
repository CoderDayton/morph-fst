[package]
name = "morph-fst"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Rule-based morphological analyzer (finite-state, lexc/twolc-like spec language) fused with a deterministic WordPiece fallback for unknown words. Handles bidirectional and opaque vowel harmony and learns lexical exceptions from raw text"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/morph-fst"
# repository = "https://github.com/CoderDatyon/morph-fst"   # add before publishing
keywords = ["morphology", "tokenizer", "fst", "nlp", "wordpiece"]
categories = ["text-processing", "parsing", "science"]
include = [
    "/src/**/*.rs",
    "/data/*.morph",
    "/data/*.txt",
    "/examples/quickstart.rs",
    "/examples/learn_exceptions.rs",
    "/tests/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = []
# The `morph-fst` command-line tool.
cli = []

[[bin]]
name = "morph-fst"
required-features = ["cli"]

[[example]]
name = "quickstart"

[[example]]
name = "search"

[[example]]
name = "learn_exceptions"

[[example]]
name = "heldout"

# English no-regression and throughput harness; not published.
[[example]]
name = "regress"

# Regenerates data/english.morph from tools/english/grammar.morph and ESDB.
[[example]]
name = "build_english"
test = true

[[test]]
name = "api"

[[test]]
name = "discover"

[[test]]
name = "friendly"

[[test]]
name = "tokenize"

[[test]]
name = "lemma"

[[test]]
name = "terms"

[[test]]
name = "linmax_prop"

[[test]]
name = "exceptions"

[[test]]
name = "golden"

[[test]]
name = "languages"

[[test]]
name = "right_harmony"

[[test]]
name = "robustness"

[[test]]
name = "rules_prop"

[package.metadata.docs.rs]
all-features = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 16

[profile.dev]
opt-level = 0
lto = false

[profile.test]
opt-level = 2
